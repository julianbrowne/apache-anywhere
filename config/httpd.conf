
# Minimum for apache

ServerRoot ${APACHE_ANYWHERE_ROOT}

ServerName localhost

LoadModule env_module           ${APACHE_HTTPD_MODULES}/mod_env.so
LoadModule mpm_prefork_module   ${APACHE_HTTPD_MODULES}/mod_mpm_prefork.so
LoadModule dir_module           ${APACHE_HTTPD_MODULES}/mod_dir.so
LoadModule mime_module          ${APACHE_HTTPD_MODULES}/mod_mime.so
LoadModule log_config_module    ${APACHE_HTTPD_MODULES}/mod_log_config.so
LoadModule authz_host_module    ${APACHE_HTTPD_MODULES}/mod_authz_host.so
LoadModule autoindex_module     ${APACHE_HTTPD_MODULES}/mod_autoindex.so
LoadModule headers_module       ${APACHE_HTTPD_MODULES}/mod_headers.so
LoadModule rewrite_module       ${APACHE_HTTPD_MODULES}/mod_rewrite.so
LoadModule cgi_module           ${APACHE_HTTPD_MODULES}/mod_cgi.so
LoadModule access_compat_module ${APACHE_HTTPD_MODULES}/mod_access_compat.so
LoadModule unixd_module         ${APACHE_HTTPD_MODULES}/mod_unixd.so
LoadModule authn_core_module    ${APACHE_HTTPD_MODULES}/mod_authn_core.so
LoadModule authz_core_module    ${APACHE_HTTPD_MODULES}/mod_authz_core.so
LoadModule filter_module        ${APACHE_HTTPD_MODULES}/mod_filter.so
LoadModule deflate_module       ${APACHE_HTTPD_MODULES}/mod_deflate.so
#LoadModule php7_module          ${APACHE_HTTPD_MODULES}/libphp7.so

AddHandler cgi-script .cgi .rb .pl

# DefaultType text/plain

DirectoryIndex index.html

# info | error | warn | debug

LogLevel debug

<Directory />
    Options All MultiViews
    AllowOverride All
    Order allow,deny
    Allow from all
    Header always add Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Headers "origin, x-requested-with, content-type"
    Header always set Access-Control-Allow-Methods "PUT, GET, POST, DELETE, TRACE, OPTIONS"
</Directory>

<VirtualHost *>
    ServerAlias 127.0.0.1
    ServerAlias myserver
    #ServerAlias othername-for-this-host
</VirtualHost>

<IfModule php7_module>
    AddType application/x-httpd-php .php
    AddType application/x-httpd-php-source .phps

    <IfModule dir_module>
        DirectoryIndex index.html index.php
    </IfModule>
</IfModule>
